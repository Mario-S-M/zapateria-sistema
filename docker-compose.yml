services:
  postgres:
    image: postgres:15-alpine
    container_name: zapateria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zapateria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zapateria_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zapateria"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./zapateria-backend
      dockerfile: Dockerfile
    container_name: zapateria_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: zapateria
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - zapateria_network
    depends_on:
      postgres:
        condition: service_healthy

  mobile:
    build:
      context: ./zapateria-mobile
      dockerfile: Dockerfile
    container_name: zapateria_mobile
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${RASPBERRY_IP}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      backend:
        condition: service_started
    networks:
      - zapateria_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  zapateria_network:
    driver: bridge
