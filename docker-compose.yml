services:
  postgres:
    image: postgres:15-alpine
    container_name: zapateria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zapateria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zapateria_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zapateria"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./zapateria-backend
      dockerfile: Dockerfile
    container_name: zapateria_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: zapateria
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - zapateria_network
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./zapateria_flutter
      dockerfile: Dockerfile
    container_name: zapateria_web
    restart: unless-stopped
    ports:
      - "8090:80"
    networks:
      - zapateria_network
    depends_on:
      backend:
        condition: service_started

  # Túnel de Cloudflare para que ElevenLabs llegue a /mcp (SPEC 01).
  # Solo arranca con: docker compose --profile tunel up -d
  mcp_gateway:
    image: nginx:1.27-alpine
    container_name: zapateria_mcp_gateway
    restart: unless-stopped
    profiles: ["tunel"]
    volumes:
      - ./mcp-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - zapateria_network
    depends_on:
      backend:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zapateria_cloudflared
    restart: unless-stopped
    profiles: ["tunel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - zapateria_network
    depends_on:
      - mcp_gateway

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  zapateria_network:
    driver: bridge
