# Gateway público del túnel de Cloudflare: reenvía SOLO POST /mcp al backend.
# El resto de la API no tiene autenticación y nunca debe salir por el túnel.
server {
    listen 80;
    client_max_body_size 64k;

    location = /mcp {
        limit_except POST { deny all; }
        proxy_pass http://backend:3000/mcp;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
