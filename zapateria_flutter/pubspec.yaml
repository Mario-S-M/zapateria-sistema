name: zapateria_flutter
description: Sistema de gestión de zapatería - App móvil Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.1
  provider: ^6.1.1
  go_router: ^13.0.0
  mobile_scanner: ^7.0.0
  image_picker: ^1.0.5
  path_provider: ^2.1.1
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
