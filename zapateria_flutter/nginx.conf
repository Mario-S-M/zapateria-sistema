server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Imágenes del backend — cachear 30 días en el navegador
    # Los nombres son únicos por upload, por lo que immutable es seguro
    location ^~ /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Archivos de Flutter SIN hash en el nombre: deben revalidarse siempre,
    # si no Cloudflare y los navegadores se quedan con el build anterior.
    # Incluye la fuente de iconos (MaterialIcons-Regular.otf): se recorta con
    # tree-shaking en cada build, así que un icono nuevo no sale si el navegador
    # conserva la copia anterior.
    location ~* ^/(main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json|assets/(AssetManifest\.[a-z]+|FontManifest\.json|fonts/.+))$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Resto de assets (fuentes, canvaskit, iconos) — cachear 1 año
    location ~* \.(js|css|wasm|ttf|woff2?|eot|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html y rutas SPA — sin caché para que los deploys apliquen de inmediato
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
