name: APK Android

# Compila el APK firmado de zapateria_flutter.
# - En cualquier rama: deja el APK como artefacto del workflow (para probar).
# - En main: cada push que toque la app crea un Release nuevo. El número de build
#   es el número de ejecución del workflow (siempre creciente), así que no hay que
#   editar pubspec.yaml: solo cambia `version:` para subir la versión visible.
#   La Raspberry lo detecta (cron, ~10 min) y lo publica en https://aragorn-system.com/app/
on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'zapateria_flutter/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  API_URL: https://api.aragorn-system.com

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zapateria_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Leer versión de pubspec.yaml
        id: version
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${V%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Versión ${V%%+*}, build ${{ github.run_number }}"

      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/zapateria-release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=zapateria"
            echo "storeFile=zapateria-release.jks"
          } > android/key.properties

      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release --dart-define=API_URL=$API_URL --build-number=${{ steps.version.outputs.build }}

      - name: Nombrar APK con su versión
        id: apk
        run: |
          NAME="zapateria-${{ steps.version.outputs.name }}-b${{ steps.version.outputs.build }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "file=zapateria_flutter/$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.name }}-b${{ steps.version.outputs.build }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 14

      - name: Publicar Release (solo main y versión nueva)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v${{ steps.version.outputs.name }}-b${{ steps.version.outputs.build }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe; no se publica de nuevo."
          else
            gh release create "$TAG" "../${{ steps.apk.outputs.file }}" \
              --title "Zapatería ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.build }})" \
              --notes "$(git log -1 --format=%s)"
          fi
